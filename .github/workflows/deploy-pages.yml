name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Normalize visual HTML for legacy bundler
        run: node build/normalize-visual-source.mjs

      - name: Run build (merge step — no external deps, node fs/path only)
        run: node build/build.mjs

      - name: Inline Digital Ney visual shell
        run: node build/inline-digital-ney-shell.mjs

      - name: Add root redirect to homepage
        run: cp build/root-redirect.html build/dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
