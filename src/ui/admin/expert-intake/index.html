<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>صفحة الخبير (إدارية) — مِران</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --cream: #FAF6EC;
      --ink: #1C1C1A;
      --ink-soft: #5F5E5A;
      --teal: #0F6E56;
      --teal-deep: #073D34;
      --teal-tint: #E1F0EB;
      --amber: #BA7517;
      --amber-tint: #F8ECD8;
      --amber-ink: #7a4c0d;
      --hairline: rgba(28, 28, 26, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at 19% 8%, rgba(255,255,255,.9) 0 12%, transparent 31%),
        radial-gradient(circle at 79% 15%, rgba(255,250,237,.8), transparent 30%),
        linear-gradient(110deg, #fbf6eb 0%, #f7edd9 48%, #efe0c5 100%);
      background-attachment: fixed;
      color: var(--ink);
      margin: 0;
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .page-shell { max-width: 560px; margin: 0 auto; padding: 28px 20px 64px; text-align: center; }

    .admin-banner {
      background: var(--amber-tint); color: var(--amber-ink); font-size: 0.8rem; font-weight: 600;
      padding: 8px 14px; border-radius: 999px; display: inline-block; margin-bottom: 20px;
    }
    h1 { font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 1.5rem; margin: 0 0 6px; color: var(--teal-deep); }
    .page-sub { color: var(--ink-soft); margin: 0 0 28px; font-size: 0.88rem; }

    .intake-form-card, .intake-table-card {
      text-align: right; margin-bottom: 18px; border: 1px solid var(--hairline); border-radius: 18px;
      padding: 18px; background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.3));
      box-shadow: 0 10px 26px rgba(71,50,24,.05);
    }

    .intake-type-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
    .intake-type-btn {
      flex: 1; padding: 10px; border-radius: 999px; border: 1px solid var(--hairline);
      background: rgba(255,255,255,.5); color: var(--ink-soft); font-weight: 700; font-size: 0.9rem;
      cursor: pointer; font-family: "IBM Plex Sans Arabic", sans-serif;
    }
    .intake-type-btn.note.active { background: var(--teal-deep); color: var(--cream); border-color: var(--teal-deep); }
    .intake-type-btn.maqam.active { background: var(--amber); color: var(--cream); border-color: var(--amber); }

    .intake-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .intake-field-grid[hidden] { display: none; }
    .intake-field label { display: block; font-size: 0.76rem; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }
    .intake-field select {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--hairline);
      background: rgba(255,255,255,.7); color: var(--ink); font-family: "IBM Plex Sans Arabic", sans-serif; font-size: 0.88rem;
    }
    .intake-field select option:disabled { color: var(--ink-soft); opacity: .55; }

    .btn-ghost-link {
      display: inline-block; background: none; border: none; color: var(--teal); font-weight: 700;
      font-size: 0.82rem; font-family: "IBM Plex Sans Arabic", sans-serif; cursor: pointer; padding: 4px 0 14px;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .btn-ghost-link[hidden] { display: none; }

    .intake-table-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .intake-table-header h2 { font-size: 1rem; color: var(--teal-deep); margin: 0; font-family: "IBM Plex Sans Arabic", sans-serif; }
    .intake-table-count { font-size: 0.8rem; color: var(--ink-soft); }
    .intake-table-rows { display: flex; flex-direction: column; gap: 8px; }
    .intake-table-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
      background: rgba(255,255,255,.6); border: 1px solid var(--hairline);
    }
    .intake-table-badge { flex: none; font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
    .intake-table-badge.note { background: var(--teal-tint); color: var(--teal-deep); }
    .intake-table-badge.maqam { background: var(--amber-tint); color: var(--amber-ink); }
    .intake-table-detail { flex: 1; font-size: 0.86rem; font-weight: 600; }
    .intake-table-actions { flex: none; display: flex; gap: 6px; }
    .icon-btn {
      width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--hairline);
      background: rgba(255,255,255,.7); cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; color: var(--teal-deep);
    }
    .icon-btn.danger { color: #7a2a2a; }
    .intake-table-empty { text-align: center; color: var(--ink-soft); font-size: 0.85rem; padding: 14px 0; }
    .intake-table-footer { display: flex; justify-content: center; margin-top: 14px; }

    .intake-checklist {
      text-align: right; margin-bottom: 18px; border: 1px solid var(--hairline); border-radius: 16px;
      padding: 14px 16px; background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.32));
      box-shadow: 0 10px 26px rgba(71,50,24,.05);
    }
    .intake-checklist summary {
      cursor: pointer; font-size: 0.85rem; font-weight: 700; color: var(--teal-deep);
      list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .intake-checklist summary::-webkit-details-marker { display: none; }
    .intake-checklist summary::after {
      content: "‹"; display: inline-block; font-size: 1.1rem; line-height: 1; color: var(--amber);
      transform: rotate(-90deg); transition: transform .2s ease;
    }
    .intake-checklist[open] summary::after { transform: rotate(0deg); }

    .intake-checklist-progress-track {
      height: 6px; border-radius: 999px; background: var(--hairline); margin: 12px 0 4px; overflow: hidden;
    }
    .intake-checklist-progress-fill {
      height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--teal), var(--teal-deep));
      transition: width .35s ease;
    }

    .intake-checklist-list {
      max-height: 320px; overflow-y: auto; margin-top: 10px; font-size: 0.8rem;
      display: flex; flex-direction: column; gap: 6px; padding: 2px 2px 8px;
      -webkit-mask-image: linear-gradient(to top, transparent 0, #000 22px);
      mask-image: linear-gradient(to top, transparent 0, #000 22px);
    }
    .intake-checklist-list::-webkit-scrollbar { width: 7px; }
    .intake-checklist-list::-webkit-scrollbar-track { background: transparent; }
    .intake-checklist-list::-webkit-scrollbar-thumb { background: var(--teal-tint); border-radius: 999px; }

    .intake-checklist-divider {
      font-size: 0.72rem; font-weight: 700; color: var(--amber-ink); text-transform: none;
      padding: 10px 6px 2px; margin-top: 6px;
    }
    .intake-checklist-divider:first-child { margin-top: 0; padding-top: 2px; }

    .intake-checklist-item {
      display: flex; align-items: center; gap: 9px; padding: 8px 12px; border-radius: 10px;
      color: var(--ink-soft); background: rgba(255,255,255,.5); border: 1px solid var(--hairline);
      cursor: pointer; transition: background .15s ease;
    }
    .intake-checklist-item:hover:not(.done) { background: rgba(15,110,86,.06); }
    .intake-checklist-item.current {
      color: var(--amber-ink); font-weight: 700; background: var(--amber-tint);
      border-color: rgba(186,117,23,.4);
    }
    .intake-checklist-item.done { color: var(--teal-deep); background: var(--teal-tint); border-color: rgba(15,110,86,.2); cursor: default; }
    .intake-checklist-item.done .intake-checklist-text { text-decoration: line-through; text-decoration-color: rgba(7,61,52,.35); }

    .intake-checklist-dot {
      flex: none; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--hairline);
      background: transparent; position: relative;
    }
    .intake-checklist-item.current .intake-checklist-dot {
      border-color: var(--amber); background: var(--amber); box-shadow: 0 0 0 3px rgba(186,117,23,.18);
    }
    .intake-checklist-item.done .intake-checklist-dot {
      border-color: var(--teal-deep); background: var(--teal-deep);
    }
    .intake-checklist-item.done .intake-checklist-dot::after {
      content: ""; position: absolute; inset: 0; margin: auto; width: 3px; height: 5px;
      border-right: 1.5px solid var(--cream); border-bottom: 1.5px solid var(--cream);
      transform: translateY(-1px) rotate(45deg);
    }
    .intake-checklist-text { flex: 1; }

    .intake-item-label { font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 2rem; margin: 0 0 6px; color: var(--teal-deep); }
    .intake-item-hint { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 24px; }

    .intake-preroll {
      font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700; font-size: 1.7rem;
      color: var(--amber-ink); background: var(--amber-tint); border-radius: 16px;
      padding: 14px; margin-bottom: 20px; font-variant-numeric: tabular-nums;
    }

    .intake-live {
      font-family: "IBM Plex Sans Arabic", sans-serif; font-size: 2.6rem; font-weight: 700;
      font-variant-numeric: tabular-nums; color: var(--ink-soft); margin-bottom: 4px;
    }
    .intake-live.ok { color: var(--teal-deep); }
    .intake-quality-note { min-height: 1.3em; font-size: 0.82rem; color: var(--amber-ink); margin: 0 0 20px; }

    .intake-controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .btn-primary {
      padding: 11px 22px; font-size: 0.95rem; font-weight: 700; font-family: "IBM Plex Sans Arabic", sans-serif;
      border-radius: 999px; border: 1px solid rgba(186,117,23,.48); background: var(--teal-deep); color: var(--cream); cursor: pointer;
      box-shadow: 0 8px 18px rgba(15,110,86,.13);
    }
    .btn-primary:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
    .btn-secondary {
      padding: 10px 20px; font-size: 0.9rem; font-family: "IBM Plex Sans Arabic", sans-serif; font-weight: 700;
      border-radius: 999px; border: 1px solid rgba(15,110,86,.35); color: var(--teal-deep);
      background: var(--teal-tint); cursor: pointer;
    }
    .btn-skip {
      padding: 10px 18px; font-size: 0.85rem; font-family: "IBM Plex Sans Arabic", sans-serif;
      border-radius: 999px; border: 1px solid var(--hairline); color: var(--ink-soft);
      background: transparent; cursor: pointer;
    }

    .intake-alternate-panel {
      background: rgba(255,255,255,.6); border: 1px solid var(--hairline); border-radius: 18px;
      padding: 16px 18px; margin-bottom: 20px; text-align: right;
    }
    .intake-alt-panel-title { font-size: 0.88rem; color: var(--ink-soft); margin: 0 0 10px; }
    .intake-alt-note-list {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 6px;
      max-height: 220px; overflow-y: auto; margin-bottom: 14px; font-size: 0.85rem;
    }
    .intake-alt-note-option { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .intake-alt-panel-actions { display: flex; gap: 10px; justify-content: center; }

    .intake-review {
      background: rgba(255,255,255,.55); border: 1px solid var(--hairline); border-radius: 22px 9px 22px 9px; padding: 18px 20px; margin-bottom: 20px;
      box-shadow: 0 18px 44px rgba(71,50,24,.05);
    }
    .intake-review-label { font-size: 0.82rem; color: var(--ink-soft); margin: 0 0 6px; text-align: right; }
    .intake-review-label-secondary { margin-top: 12px; }
    .intake-audio-preview { width: 100%; margin-bottom: 10px; }
    .intake-audio-preview-raw { opacity: 0.85; }
    .intake-split-warning { font-size: 0.82rem; color: var(--amber-ink); background: var(--amber-tint); border-radius: 12px; padding: 8px 12px; margin: 0 0 12px; text-align: right; }
    .intake-measured { font-size: 0.88rem; margin: 0 0 14px; }
    .intake-measured strong { color: var(--teal-deep); }
    .intake-measured-none { color: var(--ink); font-weight: 700; }
    .intake-review-actions { display: flex; gap: 10px; justify-content: center; }

    .intake-summary { color: var(--ink-soft); font-size: 0.85rem; }
    .intake-summary p { margin: 0 0 12px; }
  </style>
</head>
<body>
  <div class="page-shell">
    <span class="admin-banner">صفحة إدارية — غير مُدرَجة بالتنقّل العام</span>
    <h1>جلسة تسجيل خبير</h1>
    <p class="page-sub">اختر نغمة (اسم + زمن) أو مقامًا (اسم + نوع)، سجّل، ويُضاف السطر تلقائيًا لجدول الجلسة — 100 نغمة (25 × 4 قيم إيقاعية) + 16 تسجيل مقام إلزامي + هبوطات بديلة اختيارية (القرارات 9.2/9.4/13.1–13.7/14)</p>

    <div id="app"></div>
  </div>

  <script type="module">
    import { mountExpertIntakePage } from "./expert-intake-page.js";
    mountExpertIntakePage(document.getElementById("app"));
  </script>
</body>
</html>
