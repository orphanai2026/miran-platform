<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>صفحة الخبير (إدارية) — مِران</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --cream: #FAF6EC;
      --ink: #1C1C1A;
      --ink-soft: #5F5E5A;
      --teal: #0F6E56;
      --teal-deep: #085041;
      --teal-tint: #E1F0EB;
      --amber: #BA7517;
      --amber-tint: #F8ECD8;
      --hairline: rgba(28, 28, 26, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Tajawal", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      margin: 0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .page-shell { max-width: 560px; margin: 0 auto; padding: 28px 20px 64px; text-align: center; }

    .admin-banner {
      background: var(--amber-tint); color: #7a4c0d; font-size: 0.8rem; font-weight: 600;
      padding: 8px 14px; border-radius: 999px; display: inline-block; margin-bottom: 20px;
    }
    h1 { font-family: "Cairo", "Tajawal", sans-serif; font-weight: 800; font-size: 1.5rem; margin: 0 0 6px; }
    .page-sub { color: var(--ink-soft); margin: 0 0 28px; font-size: 0.88rem; }

    .intake-progress { color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 6px; }
    .intake-item-label { font-family: "Cairo", sans-serif; font-weight: 800; font-size: 2rem; margin: 0 0 6px; }
    .intake-item-hint { color: var(--ink-soft); font-size: 0.9rem; margin: 0 0 24px; }

    .intake-live {
      font-family: "Cairo", sans-serif; font-size: 2.6rem; font-weight: 800;
      font-variant-numeric: tabular-nums; color: var(--ink-soft); margin-bottom: 4px;
    }
    .intake-live.ok { color: var(--teal-deep); }
    .intake-quality-note { min-height: 1.3em; font-size: 0.82rem; color: #7a4c0d; margin: 0 0 20px; }

    .intake-controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .btn-primary {
      padding: 12px 26px; font-size: 0.95rem; font-weight: 600; font-family: "Cairo", sans-serif;
      border-radius: 10px; border: none; background: var(--ink); color: var(--cream); cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }
    .btn-secondary {
      padding: 11px 22px; font-size: 0.9rem; font-family: "Cairo", sans-serif; font-weight: 600;
      border-radius: 10px; border: 1px solid var(--teal); color: var(--teal-deep);
      background: var(--teal-tint); cursor: pointer;
    }
    .btn-skip {
      padding: 11px 18px; font-size: 0.85rem; font-family: "Tajawal", sans-serif;
      border-radius: 10px; border: 1px solid var(--hairline); color: var(--ink-soft);
      background: transparent; cursor: pointer;
    }

    .intake-review {
      background: #fff; border: 1px solid var(--hairline); border-radius: 14px; padding: 18px 20px; margin-bottom: 20px;
    }
    .intake-audio-preview { width: 100%; margin-bottom: 10px; }
    .intake-measured { font-size: 0.88rem; margin: 0 0 14px; }
    .intake-measured strong { color: var(--teal-deep); }
    .intake-measured-none { color: #7a2a2a; }
    .intake-review-actions { display: flex; gap: 10px; justify-content: center; }

    .intake-summary { color: var(--ink-soft); font-size: 0.85rem; }
    .intake-summary p { margin: 0 0 12px; }
  </style>
</head>
<body>
  <div class="page-shell">
    <span class="admin-banner">صفحة إدارية — غير مُدرَجة بالتنقّل العام</span>
    <h1>جلسة تسجيل خبير</h1>
    <p class="page-sub">25 نغمة مفردة + 8 مقامات كاملة — تسجيل ناي حقيقي لمكتبة الاستماع المرجعية (القرار 9.2/9.4)</p>

    <div id="app"></div>
  </div>

  <script type="module">
    import { mountExpertIntakePage } from "./expert-intake-page.js";
    mountExpertIntakePage(document.getElementById("app"));
  </script>
</body>
</html>
