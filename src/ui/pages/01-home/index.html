<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>مِران</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --cream: #FAF6EC;
      --ink: #1C1C1A;
      --ink-soft: #5F5E5A;
      --teal: #0F6E56;
      --teal-deep: #085041;
      --teal-tint: #E1F0EB;
      --amber: #BA7517;
      --amber-tint: #F8ECD8;
      --chip: #F1EADA;
      --amber-ink: #7a4c0d;
      --track-bg: #c9c9c9;
      --hairline: rgba(28, 28, 26, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Tajawal", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      margin: 0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .page-shell { max-width: 980px; margin: 0 auto; padding: 28px 20px 64px; }

    .site-nav {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 32px; padding-bottom: 16px;
      border-bottom: 1px solid var(--hairline);
    }
    .site-nav-link {
      padding: 7px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 500;
      text-decoration: none; color: var(--ink-soft); background: transparent;
      border: 1px solid transparent; transition: background 0.15s ease, color 0.15s ease;
    }
    .site-nav-link:hover { background: var(--teal-tint); color: var(--teal-deep); }
    .site-nav-link.active { background: var(--ink); color: var(--cream); }

    .home-hero { margin-bottom: 8px; }
    .home-eyebrow {
      display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em;
      color: var(--teal); margin-bottom: 10px;
    }
    h1 {
      font-family: "Cairo", "Tajawal", sans-serif;
      font-weight: 800; font-size: 2.6rem; line-height: 1.15; margin: 0 0 10px;
    }
    .page-sub { color: var(--ink-soft); margin: 0; font-size: 1rem; max-width: 46ch; }

    .breath-line { display: block; width: 100%; height: 28px; margin: 30px 0 38px; }
    .breath-line path { fill: none; stroke: var(--teal); stroke-width: 1.6; stroke-linecap: round; opacity: 0.55; }
    .breath-line circle { fill: var(--amber); opacity: 0.85; }

    /* شبكة بينتو: بطاقة التقدّم أعرض يسارًا، الدخول السريع أضيق يمينًا،
       شريط المعرّف المحلي يمتد بعرض الشبكة كاملة أسفلهما. */
    .home-page {
      display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 20px; align-items: start;
    }
    .home-section { margin: 0; }
    .home-section h2 {
      font-family: "Cairo", "Tajawal", sans-serif;
      font-weight: 600; font-size: 1rem; margin: 0 0 16px; color: var(--ink);
    }

    .home-progress-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    }
    .home-progress-item {
      position: relative; background: #fff; border: 1px solid var(--hairline); border-radius: 16px;
      padding: 20px 16px 18px; text-align: center; overflow: hidden;
    }
    .home-progress-item::before {
      content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--teal);
      opacity: 0.7;
    }
    .home-progress-value {
      display: block; font-family: "Cairo", sans-serif; font-size: 2.1rem; font-weight: 800;
      color: var(--teal-deep); font-variant-numeric: tabular-nums;
    }
    .home-progress-label { display: block; margin-top: 6px; font-size: 0.8rem; color: var(--ink-soft); }

    .home-quick-links { display: flex; flex-direction: column; gap: 10px; }
    .home-quick-link {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      background: #fff; border: 1px solid var(--hairline); border-radius: 12px; padding: 16px 18px;
      text-decoration: none; color: var(--ink); transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }
    .home-quick-link:hover { border-color: var(--teal); transform: translateX(-3px); box-shadow: 0 6px 18px rgba(15, 110, 86, 0.1); }
    .home-quick-link.primary { background: var(--ink); color: var(--cream); border-color: var(--ink); }
    .home-quick-link.primary .home-quick-link-note { color: rgba(250, 246, 236, 0.65); }
    .home-quick-link-label { font-family: "Cairo", sans-serif; font-weight: 600; font-size: 0.98rem; }
    .home-quick-link-note { font-size: 0.82rem; color: var(--ink-soft); }

    .home-user-id-note {
      grid-column: 1 / -1; margin-top: 4px; font-size: 0.78rem; color: var(--ink-soft);
      padding-top: 20px; border-top: 1px solid var(--hairline);
    }
    .home-user-id-note code {
      direction: ltr; display: inline-block; background: var(--amber-tint); color: var(--amber-ink);
      padding: 2px 8px; border-radius: 6px; font-size: 0.76rem;
    }

    /* بطاقة ثانوية هادئة — لا تنافس بطاقتَي البينتو بصريًا */
    .staged-verify-section {
      margin-top: 28px; padding: 22px 24px; background: #fff;
      border: 1px solid var(--hairline); border-radius: 16px;
    }
    .staged-verify-section h2 { font-family: "Cairo", sans-serif; font-weight: 700; font-size: 0.92rem; margin: 0 0 6px; }
    .staged-verify-section-note { color: var(--ink-soft); font-size: 0.82rem; margin: 0 0 14px; }
    .staged-verify-idle {
      color: var(--ink-soft); font-size: 0.88rem; padding: 16px; text-align: center;
      background: var(--cream); border: 1px dashed var(--hairline); border-radius: 12px; margin: 0;
    }
    .staged-verify-prompt {
      background: var(--cream); border: 1px solid var(--hairline); border-radius: 14px; padding: 18px; text-align: center;
    }
    .staged-verify-note { margin: 0 0 14px; font-size: 0.95rem; }
    .staged-verify-note strong { color: var(--teal-deep); font-family: "Cairo", sans-serif; }
    .staged-verify-live {
      font-family: "Cairo", sans-serif; font-size: 2rem; font-weight: 800;
      font-variant-numeric: tabular-nums; color: var(--ink-soft); margin-bottom: 4px;
    }
    .staged-verify-live.ok { color: var(--teal-deep); }
    .staged-verify-status { min-height: 1.3em; font-size: 0.85rem; color: var(--ink-soft); margin: 0 0 14px; }
    .staged-verify-progress { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .staged-verify-dot {
      width: 14px; height: 14px; border-radius: 50%; background: var(--chip); border: 2px solid var(--hairline);
    }
    .staged-verify-dot.filled { background: var(--teal); border-color: var(--teal); }

    @media (max-width: 760px) {
      .home-page { grid-template-columns: 1fr; }
      .home-progress-grid { grid-template-columns: repeat(2, 1fr); }
      h1 { font-size: 2.1rem; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <div id="siteNav"></div>

    <div class="home-hero">
      <span class="home-eyebrow">منصة تعليم الناي الشرقي</span>
      <h1>مِران</h1>
      <p class="page-sub">نظرة عامة على تقدّمك، ودخول سريع لكل مرحلة من رحلة إتقان الآلة.</p>
    </div>

    <svg class="breath-line" viewBox="0 0 680 28" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 14 L110 14 L140 4 L170 24 L200 14 L680 14" />
      <circle cx="140" cy="4" r="3" />
      <circle cx="170" cy="24" r="3" />
    </svg>

    <div id="app"></div>

    <section class="staged-verify-section">
      <h2>الاختبار المرحلي</h2>
      <p class="staged-verify-section-note">
        بعد إتقان نغمة في التمارين، أعد عزفها هنا للتأكيد — تسجيل تلقائي واحد يُعتمَد بعد قراءات متتالية متفقة (القرار 9.3).
      </p>
      <div id="stagedVerifyApp"></div>
    </section>
  </div>

  <script type="module">
    import { mountNav } from "../../shared/nav.js";
    import { mountHomePage } from "./home-page.js";
    import { mountStagedVerificationPanel } from "./staged-verification-panel.js";
    mountNav(document.getElementById("siteNav"), "home");
    mountHomePage(document.getElementById("app"));
    mountStagedVerificationPanel(document.getElementById("stagedVerifyApp"));
  </script>
  </body>
</html>
