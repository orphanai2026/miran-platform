<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الإعدادات والمزامنة — مِران</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --cream: #FAF6EC;
      --ink: #1C1C1A;
      --ink-soft: #5F5E5A;
      --teal: #0F6E56;
      --teal-deep: #085041;
      --teal-tint: #E1F0EB;
      --amber: #BA7517;
      --amber-tint: #F8ECD8;
      --hairline: rgba(28, 28, 26, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Tajawal", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      margin: 0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .page-shell { max-width: 640px; margin: 0 auto; padding: 28px 20px 64px; }

    .site-nav {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 32px; padding-bottom: 16px;
      border-bottom: 1px solid var(--hairline);
    }
    .site-nav-link {
      padding: 7px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 500;
      text-decoration: none; color: var(--ink-soft); background: transparent;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .site-nav-link:hover { background: var(--teal-tint); color: var(--teal-deep); }
    .site-nav-link.active { background: var(--ink); color: var(--cream); }

    h1 { font-family: "Cairo", "Tajawal", sans-serif; font-weight: 800; font-size: 1.7rem; margin: 0 0 8px; }
    .page-sub { color: var(--ink-soft); margin: 0 0 24px; font-size: 0.92rem; }

    .settings-section {
      background: #fff; border: 1px solid var(--hairline); border-radius: 14px; padding: 18px 20px; margin: 0 0 14px;
    }
    .settings-section h2 { font-family: "Cairo", sans-serif; font-weight: 700; font-size: 1rem; margin: 0 0 8px; }
    .settings-explain { color: var(--ink-soft); font-size: 0.88rem; margin: 0 0 12px; line-height: 1.55; }

    .settings-code {
      display: block; padding: 10px 12px; background: var(--amber-tint); border: none;
      border-radius: 8px; font-family: monospace; font-size: 0.88rem; word-break: break-all;
      color: #7a4c0d; direction: ltr; text-align: start;
    }

    .settings-tolerance-row { display: flex; gap: 20px; font-size: 0.92rem; color: var(--ink); }

    .settings-link {
      display: inline-block; margin-top: 4px; color: var(--teal-deep); font-weight: 600; text-decoration: none;
    }
    .settings-link:hover { text-decoration: underline; }

    .settings-endpoint-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px;
    }
    .settings-endpoint-row label { flex-basis: 100%; font-size: 0.85rem; color: var(--ink-soft); }
    .settings-endpoint-row input {
      flex: 1; min-width: 180px; padding: 9px 12px; font-size: 0.9rem; font-family: "Tajawal", sans-serif;
      border: 1px solid var(--hairline); border-radius: 8px; direction: ltr; text-align: start;
      background: var(--cream); color: var(--ink);
    }
    .settings-endpoint-row input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
    .btn-secondary {
      padding: 9px 18px; font-size: 0.88rem; font-family: "Cairo", sans-serif; font-weight: 600;
      border-radius: 999px; border: 1px solid var(--teal); color: var(--teal-deep);
      background: var(--teal-tint); cursor: pointer;
    }
    .settings-sync-status { margin-top: 8px; font-size: 0.85rem; color: var(--ink-soft); min-height: 1.3em; }
  </style>
</head>
<body>
  <div class="page-shell">
    <div id="siteNav"></div>
    <h1>الإعدادات والمزامنة</h1>
    <p class="page-sub">كود المزامنة، إعدادات السماحية، ونقل البيانات</p>

    <div id="app"></div>
  </div>

  <script type="module">
    import { mountNav } from "../../shared/nav.js";
    import { mountSettingsSyncPage } from "./settings-sync-page.js";
    mountNav(document.getElementById("siteNav"), "settings");
    mountSettingsSyncPage(document.getElementById("app"));
  </script>
</body>
</html>
