<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الإعدادات والمزامنة — مِران</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: "Cairo", "Tajawal", system-ui, sans-serif;
      max-width: 560px;
      margin: 32px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    h1 { font-size: 1.3rem; margin-bottom: 4px; }
    .page-sub { color: #555; margin-top: 0; font-size: 0.9rem; }

    .settings-section {
      border: 1px solid #e5e5e5; border-radius: 10px; padding: 16px; margin: 18px 0;
    }
    .settings-section h2 { font-size: 1rem; margin: 0 0 8px; }
    .settings-explain { color: #444; font-size: 0.9rem; margin: 0 0 12px; }

    .settings-code {
      display: block; padding: 10px 12px; background: #faf6ec; border: 1px solid #ba7517;
      border-radius: 6px; font-family: monospace; font-size: 0.9rem; word-break: break-all;
      color: #1c1c1a; direction: ltr; text-align: start;
    }

    .settings-tolerance-row { display: flex; gap: 20px; font-size: 0.95rem; color: #333; }

    .settings-link {
      display: inline-block; margin-top: 4px; color: #0f6e56; font-weight: 600; text-decoration: none;
    }
    .settings-link:hover { text-decoration: underline; }

    .settings-endpoint-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px;
    }
    .settings-endpoint-row label { flex-basis: 100%; font-size: 0.85rem; color: #444; }
    .settings-endpoint-row input {
      flex: 1; min-width: 180px; padding: 8px 10px; font-size: 0.9rem; border: 1px solid #ccc;
      border-radius: 6px; direction: ltr; text-align: start;
    }
    .btn-secondary {
      padding: 7px 14px; font-size: 0.9rem; border-radius: 6px; border: 1px solid #888;
      background: #fff; cursor: pointer;
    }
    .settings-sync-status { margin-top: 8px; font-size: 0.85rem; color: #666; min-height: 1.3em; }

    .site-nav {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; padding-bottom: 14px;
      border-bottom: 1px solid #e5e5e5;
    }
    .site-nav-link {
      padding: 6px 12px; border-radius: 999px; font-size: 0.82rem; text-decoration: none;
      color: #444; background: #f5f5f5;
    }
    .site-nav-link:hover { background: #ececec; }
    .site-nav-link.active { background: #1c1c1a; color: #fff; }
  </style>
</head>
<body>
  <div id="siteNav"></div>
  <h1>الإعدادات والمزامنة</h1>
  <p class="page-sub">كود المزامنة، إعدادات السماحية، ونقل البيانات</p>

  <div id="app"></div>

  <script type="module">
    import { mountNav } from "../../shared/nav.js";
    import { mountSettingsSyncPage } from "./settings-sync-page.js";
    mountNav(document.getElementById("siteNav"), "settings");
    mountSettingsSyncPage(document.getElementById("app"));
  </script>
</body>
</html>
