<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المعايرة الشخصية — مِران</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --cream: #FAF6EC;
      --ink: #1C1C1A;
      --ink-soft: #5F5E5A;
      --teal: #0F6E56;
      --teal-deep: #085041;
      --teal-tint: #E1F0EB;
      --amber: #BA7517;
      --amber-tint: #F8ECD8;
      --hairline: rgba(28, 28, 26, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Tajawal", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      margin: 0;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .page-shell { max-width: 640px; margin: 0 auto; padding: 28px 20px 64px; }

    .site-nav {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 32px; padding-bottom: 16px;
      border-bottom: 1px solid var(--hairline);
    }
    .site-nav-link {
      padding: 7px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 500;
      text-decoration: none; color: var(--ink-soft); background: transparent;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .site-nav-link:hover { background: var(--teal-tint); color: var(--teal-deep); }
    .site-nav-link.active { background: var(--ink); color: var(--cream); }

    h1 { font-family: "Cairo", "Tajawal", sans-serif; font-weight: 800; font-size: 1.7rem; margin: 0 0 8px; }
    .calib-sub { color: var(--ink-soft); margin: 0 0 24px; font-size: 0.92rem; max-width: 58ch; }

    .calib-fields {
      display: flex; flex-direction: column; gap: 14px; margin: 0 0 24px;
      background: #fff; border: 1px solid var(--hairline); border-radius: 14px; padding: 18px 20px;
    }
    .calib-fields label { display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; color: var(--ink-soft); font-weight: 500; }
    .calib-fields input, .calib-fields select {
      padding: 9px 12px; font-size: 0.95rem; font-family: "Tajawal", sans-serif;
      border: 1px solid var(--hairline); border-radius: 8px; background: var(--cream); color: var(--ink);
    }
    .calib-fields input:focus, .calib-fields select:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

    .calib-metronome-mount { margin: 0 0 20px; }
    .metronome-mini { display: flex; align-items: center; gap: 10px; }
    .metronome-mini-toggle {
      padding: 8px 18px; font-size: 1rem; font-family: "Cairo", sans-serif; font-weight: 600;
      border-radius: 999px; border: 1px solid var(--hairline); background: #fff; cursor: pointer;
    }

    .calib-record-area { display: flex; align-items: center; gap: 14px; margin: 0 0 12px; }
    .btn-primary {
      padding: 12px 26px; font-size: 0.95rem; font-weight: 600; font-family: "Cairo", sans-serif;
      border-radius: 10px; border: none; background: var(--ink); color: var(--cream); cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }
    .btn-secondary {
      padding: 9px 18px; font-size: 0.88rem; font-family: "Cairo", sans-serif; font-weight: 600;
      border-radius: 999px; border: 1px solid var(--teal); color: var(--teal-deep);
      background: var(--teal-tint); cursor: pointer; margin-inline-end: 8px;
    }
    .calib-live { font-variant-numeric: tabular-nums; color: var(--ink-soft); }
    .calib-live.ok { color: var(--teal-deep); font-weight: 700; }

    .calib-quality-meter { margin: 4px 0 20px; max-width: 340px; }
    .calib-quality-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
    .calib-quality-label { color: var(--ink-soft); }
    .calib-quality-value { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
    .calib-quality-bar { height: 8px; border-radius: 999px; background: #ece7d8; overflow: hidden; }
    .calib-quality-bar-fill {
      height: 100%; width: 0%; background: #c9c9c9; border-radius: 999px;
      transition: width 0.08s linear, background-color 0.15s ease;
    }
    .calib-quality-bar-fill.ok { background: var(--teal); }
    .calib-quality-bar-fill.weak { background: var(--amber); }
    .calib-quality-note { display: block; margin-top: 4px; font-size: 0.78rem; color: #7a4c0d; min-height: 1.1em; }

    .calib-hint { min-height: 1.4em; color: var(--ink-soft); font-size: 0.9rem; }
    .calib-status {
      margin-top: 24px; padding: 16px 20px; border-radius: 14px;
      background: #fff; border: 1px solid var(--hairline);
    }
    .calib-status > div { margin-bottom: 8px; font-size: 0.9rem; }

    .reference-section {
      margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--hairline);
    }
    .reference-section h2 { font-family: "Cairo", sans-serif; font-weight: 700; font-size: 1rem; margin: 0 0 6px; }
    .reference-section-note { color: var(--ink-soft); font-size: 0.85rem; margin: 0 0 16px; }
    .reference-audio-empty {
      color: var(--ink-soft); font-size: 0.88rem; padding: 16px; text-align: center;
      background: #fff; border: 1px dashed var(--hairline); border-radius: 12px;
    }
    .reference-audio-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    .reference-audio-item {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      background: #fff; border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 14px;
    }
    .reference-audio-label { font-family: "Cairo", sans-serif; font-weight: 600; font-size: 0.9rem; min-width: 3em; }
    .reference-audio-item audio { flex: 1; min-width: 180px; height: 32px; }
    .reference-audio-hz { font-size: 0.78rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="page-shell">
    <div id="siteNav"></div>
    <div id="app"></div>

    <section class="reference-section">
      <h2>استماع مرجعي — النغمات الـ25</h2>
      <p class="reference-section-note">تسجيلات ناي حقيقية من الخبراء لكل نغمة (القرار 9.2) — مرجع استماع، لا جزء من الاختبار.</p>
      <div id="calibReferenceNotes"></div>
    </section>
  </div>
  <script type="module">
    import { mountNav } from "../../shared/nav.js";
    import { mountCalibrationPage } from "./calibration-page.js";
    import { mountReferenceNotesPanel } from "./reference-notes-panel.js";
    mountNav(document.getElementById("siteNav"), "calibration");
    mountCalibrationPage(document.getElementById("app"));
    mountReferenceNotesPanel(document.getElementById("calibReferenceNotes"));
  </script>
</body>
</html>
