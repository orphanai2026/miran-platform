<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المعايرة الشخصية — مِران</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: "Cairo", "Tajawal", system-ui, sans-serif;
      max-width: 560px;
      margin: 32px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    h1 { font-size: 1.3rem; margin-bottom: 4px; }
    .calib-sub { color: #555; margin-top: 0; }
    .calib-fields { display: flex; flex-direction: column; gap: 14px; margin: 20px 0; }
    .calib-fields label { display: flex; flex-direction: column; gap: 4px; font-size: 0.95rem; }
    .calib-fields input, .calib-fields select {
      padding: 8px 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px;
    }
    .calib-metronome-mount { margin: 16px 0; }
    .metronome-mini { display: flex; align-items: center; gap: 10px; }
    .metronome-mini-toggle {
      padding: 8px 16px; font-size: 1.1rem; border-radius: 6px; border: 1px solid #999;
      background: #f5f5f5; cursor: pointer;
    }
    .calib-record-area { display: flex; align-items: center; gap: 14px; margin: 16px 0; }
    .btn-primary {
      padding: 10px 22px; font-size: 1rem; border-radius: 8px; border: none;
      background: #1c1c1a; color: #fff; cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-secondary {
      padding: 8px 16px; font-size: 0.95rem; border-radius: 6px; border: 1px solid #888;
      background: #fff; cursor: pointer; margin-inline-end: 8px;
    }
    .calib-live { font-variant-numeric: tabular-nums; color: #888; }
    .calib-live.ok { color: #0f6e56; font-weight: 600; }
    .calib-hint { min-height: 1.4em; color: #444; }
    .calib-status { margin-top: 20px; padding-top: 16px; border-top: 1px solid #e5e5e5; }
    .calib-status > div { margin-bottom: 8px; }

    .site-nav {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; padding-bottom: 14px;
      border-bottom: 1px solid #e5e5e5;
    }
    .site-nav-link {
      padding: 6px 12px; border-radius: 999px; font-size: 0.82rem; text-decoration: none;
      color: #444; background: #f5f5f5;
    }
    .site-nav-link:hover { background: #ececec; }
    .site-nav-link.active { background: #1c1c1a; color: #fff; }
  </style>
</head>
<body>
  <div id="siteNav"></div>
  <div id="app"></div>
  <script type="module">
    import { mountNav } from "../../shared/nav.js";
    import { mountCalibrationPage } from "./calibration-page.js";
    mountNav(document.getElementById("siteNav"), "calibration");
    mountCalibrationPage(document.getElementById("app"));
  </script>
</body>
</html>
