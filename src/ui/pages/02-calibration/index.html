<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>المعايرة الشخصية — مِران</title>
<link rel="stylesheet" href="../../shared/design-tokens.css" />






<link rel="stylesheet" href="../../shared/digital-ney-shell.css" />







<style>
.calib-layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(280px,.8fr);gap:26px;align-items:start;max-width:1180px}.calib-page h1,.calib-sub{display:none}.calib-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px;margin:0 0 18px;background:rgba(255,255,255,.52);border:1px solid var(--hairline);border-radius:20px}.calib-fields label{display:flex;flex-direction:column;gap:6px;color:var(--ink-soft);font-size:12px;font-weight:700}.calib-fields input,.calib-fields select{padding:10px 12px}.calib-metronome-mount{margin:0 0 16px;padding:14px 18px;border-radius:17px;background:rgba(255,255,255,.45);border:1px solid var(--hairline)}.metronome-mini{display:flex;align-items:center;gap:12px}.metronome-mini-toggle{padding:8px 17px;border-radius:999px;border:1px solid rgba(15,110,86,.22);background:var(--teal-tint);color:var(--teal-deep);font-weight:700;cursor:pointer}.calib-record-area{display:flex;align-items:center;gap:16px;margin:0 0 12px}.calib-live{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:18px}.calib-live.ok{color:var(--teal-deep);font-weight:800}.calib-quality-meter{margin:5px 0 18px;max-width:390px}.calib-quality-row{display:flex;justify-content:space-between;font-size:12px}.calib-quality-bar{height:8px;margin-top:5px;border-radius:999px;background:var(--chip);overflow:hidden}.calib-quality-bar-fill{height:100%;width:0;background:var(--track-bg);border-radius:999px}.calib-quality-bar-fill.ok{background:var(--teal)}.calib-quality-bar-fill.weak{background:var(--amber)}.calib-quality-note,.calib-hint{font-size:12px;color:var(--amber-ink)}.calib-status{margin:18px 0 40px;padding:18px;border-radius:20px;background:rgba(255,255,255,.48);border:1px solid var(--hairline)}.calib-status>div{margin-bottom:8px;font-size:13px}.reference-section{padding:22px;background:rgba(255,255,255,.55);border:1px solid var(--hairline);border-radius:24px;box-shadow:0 18px 44px rgba(71,50,24,.05)}.reference-section h2{margin:0 0 5px;font-size:17px}.reference-section-note{margin:0 0 16px;color:var(--ink-soft);font-size:12px}.reference-audio-empty{padding:18px;text-align:center;color:var(--ink-soft);font-size:12px;border:1px dashed var(--hairline);border-radius:14px;background:rgba(250,246,236,.7)}.reference-audio-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}.reference-audio-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;background:rgba(250,246,236,.72);border:1px solid var(--hairline);border-radius:12px}.reference-audio-item audio{width:100%;height:32px}.reference-audio-label{font-weight:800}.reference-audio-hz{font-size:11px;color:var(--ink-soft)}
@media(max-width:900px){.calib-layout{grid-template-columns:1fr}.calib-fields{grid-template-columns:1fr}.reference-section{margin-bottom:12px}}
</style>
</head>
<body>
<div class="page-stage">
  <header class="brand-row"><div class="brand-seal"><i></i><i></i><i></i><i></i></div><div class="brand-copy"><strong>مِران</strong><span>منصة تعليم الناي الشرقي</span></div></header>
  <section class="page-hero"><div class="page-kicker">ضبط الأذن والآلة</div><h1>المعايرة الشخصية</h1><p>ابنِ مرجعك الشخصي من عزفك الحقيقي؛ 15 محاولة على 3 أيام للمبتدئ، أو جلسة واحدة أدق للمحترف.</p><div class="breath-rule"></div></section>
  <section class="page-content calib-layout">
    <div id="app"></div>
    <section class="reference-section"><div class="eyebrow">REFERENCE • مرجع سمعي</div><h2>استماع مرجعي — النغمات الـ25</h2><p class="reference-section-note">تسجيلات ناي حقيقية من الخبراء لكل نغمة — مرجع استماع، لا جزء من الاختبار.</p><div id="calibReferenceNotes"></div></section>
  </section>
  <div id="siteNav"></div>
</div>
<script type="module">
import { mountNav } from "../../shared/nav.js";
import { mountCalibrationPage } from "./calibration-page.js";
import { mountReferenceNotesPanel } from "./reference-notes-panel.js";
mountNav(document.getElementById("siteNav"),"calibration");
mountCalibrationPage(document.getElementById("app"));
mountReferenceNotesPanel(document.getElementById("calibReferenceNotes"));
</script>
</body></html>
