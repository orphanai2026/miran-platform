<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المترونوم — مِران</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --cream: #FAF6EC;
      --ink: #1C1C1A;
      --ink-soft: #5F5E5A;
      --teal: #0F6E56;
      --teal-deep: #085041;
      --teal-tint: #E1F0EB;
      --amber: #BA7517;
      --amber-tint: #F8ECD8;
      --chip: #F1EADA;
      --amber-ink: #7a4c0d;
      --track-bg: #c9c9c9;
      --hairline: rgba(28, 28, 26, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      font-family: "Tajawal", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      margin: 0;
      line-height: 1.6;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .page-shell { max-width: 480px; margin: 0 auto; padding: 28px 20px 64px; }

    .site-nav {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 32px; padding-bottom: 16px;
      border-bottom: 1px solid var(--hairline); justify-content: center;
    }
    .site-nav-link {
      padding: 7px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 500;
      text-decoration: none; color: var(--ink-soft); background: transparent;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .site-nav-link:hover { background: var(--teal-tint); color: var(--teal-deep); }
    .site-nav-link.active { background: var(--ink); color: var(--cream); }

    h1 { font-family: "Cairo", "Tajawal", sans-serif; font-weight: 800; font-size: 1.7rem; margin: 0 0 8px; }
    .page-sub { color: var(--ink-soft); margin: 0 0 8px; font-size: 0.92rem; }

    .metronome-full {
      display: flex; flex-direction: column; align-items: center; gap: 20px; margin-top: 28px;
      background: #fff; border: 1px solid var(--hairline); border-radius: 18px; padding: 32px 24px;
    }

    .metronome-bpm-display { display: flex; align-items: baseline; gap: 8px; }
    .metronome-bpm-value {
      font-family: "Cairo", sans-serif; font-size: 3.2rem; font-weight: 800;
      font-variant-numeric: tabular-nums; color: var(--teal-deep);
    }
    .metronome-bpm-label { color: var(--ink-soft); font-size: 1rem; }

    .metronome-bpm-slider { width: 100%; max-width: 360px; accent-color: var(--teal); }

    .metronome-beats-control { display: flex; align-items: center; gap: 10px; font-size: 0.92rem; color: var(--ink-soft); }
    .metronome-beats-select {
      padding: 7px 12px; font-size: 0.95rem; font-family: "Tajawal", sans-serif;
      border: 1px solid var(--hairline); border-radius: 8px; background: var(--cream); color: var(--ink);
    }

    .metronome-beat-indicators { display: flex; gap: 10px; min-height: 24px; }
    .metronome-beat-dot {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--chip); border: 2px solid var(--hairline);
      transition: background-color 0.05s linear, border-color 0.05s linear;
    }
    .metronome-beat-dot.active { background: var(--teal); border-color: var(--teal); }
    .metronome-beat-dot.active.accent { background: var(--amber); border-color: var(--amber); }

    .metronome-toggle {
      padding: 13px 36px; font-size: 1.05rem; font-family: "Cairo", sans-serif; font-weight: 700;
      border-radius: 999px; border: none; background: var(--ink); color: var(--cream); cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .metronome-toggle:hover { opacity: 0.88; }
    .metronome-toggle:active { opacity: 0.75; }
  </style>
</head>
<body>
  <div class="page-shell">
    <div id="siteNav"></div>
    <h1>المترونوم</h1>
    <p class="page-sub">مستقل، بجدولة lookahead المحسّنة — نفس محرك صفحة المعايرة، واجهة كاملة</p>

    <div id="app"></div>
  </div>

  <script type="module">
    import { mountNav } from "../../shared/nav.js";
    import { mountFullMetronome } from "../../../metronome/metronome-ui-full.js";
    mountNav(document.getElementById("siteNav"), "metronome");
    mountFullMetronome(document.getElementById("app"));
  </script>
</body>
</html>
